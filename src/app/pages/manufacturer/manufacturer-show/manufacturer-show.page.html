<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <app-breadcrumbs>
          <ion-breadcrumb [routerLink]="['../../']">Home</ion-breadcrumb>
          <ion-breadcrumb [routerLink]="['../']">Manufacturers</ion-breadcrumb>
          <ion-breadcrumb>{{manufacturer()?.name ?? 'Unknown Manufacturer'}}</ion-breadcrumb>
        </app-breadcrumbs>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-card>
          <ion-card-content>
            <ion-list>
              <ion-item>
                <ion-label>
                  <ion-title class="title-medium">
                    {{manufacturer()?.name ?? 'Unknown Manufacturer'}}
                  </ion-title>
                </ion-label>
              </ion-item>
              <ion-item>
                <ion-label>
                  <p>
                    {{manufacturer()?.uuid}}
                  </p>
                </ion-label>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
        <ion-list>
          <ion-item>
            <ion-label>
              {{models() | json }}
            </ion-label>
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
