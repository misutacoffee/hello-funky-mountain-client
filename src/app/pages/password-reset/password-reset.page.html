<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button [routerLink]="['']">
        <ion-icon name="home-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Equipment Rental</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-buttons slot="start">
      <ion-button [routerLink]="['']">
        <ion-icon name="home-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-toolbar>
      <ion-title size="large">Equipment Rental</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="9" size-xl="6">
        <ion-item color="transparent" lines="none">
          <ion-label>
            <ion-title>
              Password Reset 
            </ion-title>
          </ion-label>
        </ion-item>
        <form [formGroup]="form()" (ngSubmit)="onSubmit">
          <ion-card>
            <ion-card-content>
              <ion-list>
                <ion-item>
                  <ion-input label="Email" type="email" formControlName="email"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="New Password" type="password" formControlName="password"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="Confirm Password" type="password" formControlName="confirm_password"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-label>
                    <ion-note>
                      {{form()?.get('token')?.value}}
                    </ion-note>
                  </ion-label>
                </ion-item>
              </ion-list>
            </ion-card-content>
          </ion-card>
          <ion-item color="transparent" lines="none">
            <ion-buttons slot="start">
              <ion-button type="submit" color="dark" fill="solid" [disabled]="form()?.invalid">
                Confirm
              </ion-button>
            </ion-buttons>
          </ion-item>
        </form>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
