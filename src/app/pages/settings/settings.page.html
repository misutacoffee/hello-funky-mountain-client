<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <app-breadcrumbs>
          <ion-breadcrumb [routerLink]="['../']">Home</ion-breadcrumb>
          <ion-breadcrumb>Settings</ion-breadcrumb>
        </app-breadcrumbs>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12">
        <ion-title>
          Settings
        </ion-title>
      </ion-col>
      <ion-col size="12" size-md="6" size-lg="4">
        <ion-card>
          <ion-card-content>
            <ion-list>
              <ion-item>
                <ion-label>
                  <ion-title class="title-medium">
                    Color Scheme
                  </ion-title>
                </ion-label>
              </ion-item>
              <ion-item>
                <ion-label>
                  <ion-radio-group value="system">
                    <ion-radio value="light" labelPlacement="end">Light</ion-radio><br />
                    <ion-radio value="dark" labelPlacement="end">Dark</ion-radio><br />
                    <ion-radio value="system" labelPlacement="end">System</ion-radio><br />
                  </ion-radio-group>
                </ion-label>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
