<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-list>
          <ion-item>
            <ion-label>
              <ion-title class="title-medium">
                Equipment
              </ion-title>
            </ion-label>
            <ion-buttons slot="end">
              <ion-button>
                New
                <ion-icon name="add-outline" slot="end"></ion-icon>
              </ion-button>
            </ion-buttons>
          </ion-item>
        </ion-list>
        @if(!equipment()){
          <ion-item>
            <ion-label>
              No equipment available
            </ion-label>
          </ion-item>
        }@else{
          @for (item of equipment(); track item.uuid){
            <ion-item>
              <ion-label>
                <h2>{{ item?.name }}</h2>
                <p>{{ item?.description }}</p>
              </ion-label>
            </ion-item>
          }
        }
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
