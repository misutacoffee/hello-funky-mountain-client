<ion-content class="page-content">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="9" size-xl="6">
        <ion-item color="transparent" lines="none">
          <ion-label>
            <ion-title>
              Forgot Password 
            </ion-title>
          </ion-label>
        </ion-item>
        <form [formGroup]="form()" (ngSubmit)="onSubmit()">
          <ion-card>
            <ion-card-content>
              <ion-list>
                <ion-item>
                  <ion-input label="Email" type="email" formControlName="email"></ion-input>
                </ion-item>
              </ion-list>
            </ion-card-content>
          </ion-card>
          <ion-item color="transparent" lines="none">
            <ion-buttons slot="start">
              <ion-button type="submit" color="dark" fill="solid" [disabled]="form()?.invalid">
                Submit
              </ion-button>
            </ion-buttons>
            <ion-buttons slot="end">
              <ion-button [routerLink]="['/login']">
                Login
              </ion-button>
              <ion-button [routerLink]="['/register']">
                Register
              </ion-button>
            </ion-buttons>
          </ion-item>
        </form>
        @if(formSubmitted){
          <ion-item color="transparent" lines="none">
            <ion-icon color="success" name="checkmark-circle-outline" slot="start"></ion-icon>
            <ion-label>
              <ion-note color="success">
                Success! Please check your inbox for a password reset link.
              </ion-note>
            </ion-label>
          </ion-item>
        }
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
