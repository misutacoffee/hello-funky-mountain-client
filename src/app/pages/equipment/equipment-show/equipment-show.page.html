<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-card>
          <ion-card-content>
            <ion-list>
              <ion-item>
                <ion-label>
                  <ion-title class="title-medium">
                    {{equipment()?.name || 'Unknown Equipment'}}
                  </ion-title>
                </ion-label>
                <ion-buttons slot="end">
                  <ion-button [routerLink]="['/equipment', uuid, 'edit']">
                    Edit
                  </ion-button>
                </ion-buttons>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
