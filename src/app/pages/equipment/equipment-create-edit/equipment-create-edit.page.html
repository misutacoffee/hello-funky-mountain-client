<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col>
        <app-breadcrumbs>
          @if(uuid){
            <ion-breadcrumb [routerLink]="['../../../']">Home</ion-breadcrumb>
            <ion-breadcrumb [routerLink]="['../../']">Equipment</ion-breadcrumb>
            <ion-breadcrumb [routerLink]="['../']">{{equipment()?.name || 'Unknown Equipment'}}</ion-breadcrumb>
            <ion-breadcrumb>Edit</ion-breadcrumb>
          }@else{
            <ion-breadcrumb [routerLink]="['../../']">Home</ion-breadcrumb>
            <ion-breadcrumb [routerLink]="['../']">Equipment</ion-breadcrumb>
            <ion-breadcrumb>Create</ion-breadcrumb>
          }
        </app-breadcrumbs>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12" size-md="9" size-xl="6">
        <ion-item color="transparent" lines="none">
          <ion-label>
            <ion-title class="title-medium">
              {{uuid ? 'Edit' : 'Create'}} Equipment 
            </ion-title>
          </ion-label>
        </ion-item>
        <ion-card>
          <ion-card-content>
            <ion-list [formGroup]="form()">
              <ion-item>
                <ion-input label="Name" formControlName="name"></ion-input>
              </ion-item>
              <ion-item>
                <ion-input label="Serial Number" formControlName="serial_number"></ion-input>
              </ion-item>
              <ion-item>
                <ion-input label="Type" formControlName="type"></ion-input>
              </ion-item>
              <ion-item>
                <ion-textarea label="Description" formControlName="description"></ion-textarea>
              </ion-item>
              <ion-item>
                <ion-textarea label="Note" formControlName="note"></ion-textarea>
              </ion-item>
              <ion-item>
                <ion-select label="Status" formControlName="status">  
                  <ion-select-option value="Available">Available</ion-select-option>
                  <ion-select-option value="Unavailable">Unavailable</ion-select-option>
                </ion-select>
              </ion-item>
              <ion-item>
                <ion-checkbox formControlName="is_active">
                  Is Active
                </ion-checkbox>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
        <ion-buttons class="ion-padding-horizontal">
          <ion-button (click)="onSubmit()" fill="solid" [disabled]="form()?.invalid">
            {{uuid ? 'Update' : 'Create'}}
          </ion-button>
          <ion-button (click)="cancel()">
            Cancel
          </ion-button>
        </ion-buttons>    
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
