<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-list [formGroup]="form()">
          <ion-item>
            <ion-label>
              <ion-title class="title-medium">
                Equipment {{uuid ? 'Edit' : 'Create'}}
              </ion-title>
            </ion-label>
          </ion-item>
          <ion-item>
            <ion-input label="Name" formControlName="name"></ion-input>
          </ion-item>
          <ion-item>
            <ion-input label="Serial Number" formControlName="serial_number"></ion-input>
          </ion-item>
          <ion-item>
            <ion-input label="Type" formControlName="type"></ion-input>
          </ion-item>
          <ion-item>
            <ion-textarea label="Description" formControlName="description"></ion-textarea>
          </ion-item>
          <ion-item>
            <ion-textarea label="Note" formControlName="note"></ion-textarea>
          </ion-item>
          <ion-item>
            <ion-select label="Type" formControlName="type">
              <ion-select-option value="Type1">Type 1</ion-select-option>
              <ion-select-option value="Type2">Type 2</ion-select-option>
            </ion-select>
          </ion-item>
          <ion-item>
            <ion-select label="Status" formControlName="status">  
              <ion-select-option value="Available">Available</ion-select-option>
              <ion-select-option value="Unavailable">Unavailable</ion-select-option>
            </ion-select>
          </ion-item>
          <ion-item>       
            <ion-button expand="block" (click)="onSubmit()">Submit</ion-button>
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
