<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <app-breadcrumbs>
          <ion-breadcrumb [routerLink]="['../']">Home</ion-breadcrumb>
          <ion-breadcrumb>Equipment</ion-breadcrumb>
        </app-breadcrumbs>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12" size-md="9" size-xl="6">
        <ion-item color="transparent" lines="none">
          <ion-label>
            <ion-title>
              Equipment
            </ion-title>
          </ion-label>
          <ion-buttons slot="end">
            <ion-button [routerLink]="['/equipment', 'create']">
              Create
            </ion-button>
          </ion-buttons>
        </ion-item>
        <ion-card>
          <ion-card-content>
            <ion-list>
              @if(!equipment() || equipment()?.length === 0){
                <ion-item>
                  <ion-label>
                    No equipment available
                  </ion-label>
                </ion-item>
              }@else{
                @for (equipment of equipment(); track equipment.uuid){
                  <ion-item>
                    <ion-label>
                      <h2>
                        <a [routerLink]="['/equipment', equipment.uuid]">
                          {{ equipment?.name }}
                        </a>
                      </h2>
                      <p>{{ equipment?.description }}</p>
                    </ion-label>
                    <ion-buttons slot="end">
                      <ion-button [routerLink]="['/equipment', equipment.uuid]">
                        View
                      </ion-button>
                      <app-ellipsis-vertical-popover>
                        <ion-item [routerLink]="['/equipment', equipment.uuid]" button>
                          View 
                        </ion-item>
                        <ion-item [routerLink]="['/equipment', equipment.uuid, 'edit']" button>
                          Edit 
                        </ion-item>
                        <ion-item (click)="delete(equipment)" button>
                          <ion-text color="danger">
                            Delete 
                          </ion-text>
                        </ion-item>
                      </app-ellipsis-vertical-popover>
                    </ion-buttons>
                  </ion-item>
                }
              }
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
