<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <app-breadcrumbs>
          <ion-breadcrumb [routerLink]="['../']">Home</ion-breadcrumb>
          <ion-breadcrumb>Rentals</ion-breadcrumb>
        </app-breadcrumbs>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12" size-md="9" size-xl="6">
        <ion-item color="transparent" lines="none">
          <ion-title>
            Rentals
          </ion-title>
          <ion-buttons slot="end">
            <ion-button [routerLink]="['/rentals', 'create']" color="dark">
              Create
            </ion-button>
          </ion-buttons>
        </ion-item>
        <ion-card>
          <ion-card-content>
            <ion-list>
              @if(!displayRentals() || displayRentals()?.length == 0){
                <ion-item>
                  <ion-label>
                    No Rentals Available 
                  </ion-label>
                </ion-item>
              }@else{
                @for(rental of displayRentals(); track rental?.uuid){
                  <ion-item>
                    <ion-label>
                      <h2>
                        <a [routerLink]="['/rentals', rental?.uuid]">
                          {{rental?.id ?? 'Unlinked Rental'}}
                        </a>
                      </h2>
                    </ion-label>
                    <ion-buttons slot="end">
                      <app-ellipsis-vertical-popover>
                        <ion-item [routerLink]="['/rentals', rental?.uuid]" button>
                          View
                        </ion-item>
                        <ion-item [routerLink]="['/rentals', rental?.uuid, 'edit']" button>
                          Edit
                        </ion-item>
                        <ion-item (click)="delete(rental?.uuid)" button>
                          <ion-text color="danger">
                            Delete
                          </ion-text>
                        </ion-item>
                      </app-ellipsis-vertical-popover>
                    </ion-buttons>
                  </ion-item>
                }
              }
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
