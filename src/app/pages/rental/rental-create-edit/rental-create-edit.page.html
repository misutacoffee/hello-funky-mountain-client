<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <app-breadcrumbs>
          @if(uuid){
            <ion-breadcrumb [routerLink]="['../../../']">Home</ion-breadcrumb>
            <ion-breadcrumb [routerLink]="['../../']">Rentals</ion-breadcrumb>
            <ion-breadcrumb [routerLink]="['../']">{{rental()?.id ?? 'Unlinked Rental'}}</ion-breadcrumb>
            <ion-breadcrumb>Edit</ion-breadcrumb>
          }@else{
            <ion-breadcrumb [routerLink]="['../../']">Home</ion-breadcrumb>
            <ion-breadcrumb [routerLink]="['../']">Rentals</ion-breadcrumb>
            <ion-breadcrumb>Create</ion-breadcrumb>
          }
        </app-breadcrumbs>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12" size-md="9" size-xl="6">
        <ion-item color="transparent" lines="none">
          <ion-label>
            <ion-title>
              {{uuid ? 'Edit' : 'Create'}} Rental 
            </ion-title>
          </ion-label>
        </ion-item>
        <ion-card>
          <ion-card-content>
            <ion-list [formGroup]="form()">
              <ion-item>
                <ion-input label="Rental Date" type="date" formControlName="rental_date"></ion-input>
              </ion-item>
              <ion-item>
                <ion-input label="Return Date" type="date" formControlName="return_date"></ion-input>
              </ion-item>
              <ion-item>
                <ion-textarea label="Description" formControlName="description" autoGrow></ion-textarea>
              </ion-item>
              <ion-item>
                <ion-textarea label="Note" formControlName="note" autoGrow></ion-textarea>
              </ion-item>
              <ion-item>
                <ion-input label="Contract UUID" formControlName="contract_uuid"></ion-input>
              </ion-item>
              <ion-item>
                <ion-input label="User UUID" formControlName="user_uuid"></ion-input>
              </ion-item>
              <ion-item>
                <ion-input label="UUID" formControlName="uuid"></ion-input>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
        <ion-item color="transparent" lines="none">
          <ion-buttons>
            <ion-button (click)="onSubmit()" [disabled]="form()?.invalid" color="dark" fill="solid">
              {{uuid ? 'Update' : 'Create'}}
            </ion-button>
            <ion-button (click)="cancel()">
              Cancel 
            </ion-button>
          </ion-buttons>
        </ion-item>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
