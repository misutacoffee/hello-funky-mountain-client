<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <app-breadcrumbs>
          @if(uuid){
            <ion-breadcrumb [routerLink]="['../../../']">Home</ion-breadcrumb>
            <ion-breadcrumb [routerLink]="['../../']">Contracts</ion-breadcrumb>
            <ion-breadcrumb [routerLink]="['../']">{{contract()?.name ?? 'Unknown Contract'}}</ion-breadcrumb>
            <ion-breadcrumb>Edit</ion-breadcrumb>
          }@else{
            <ion-breadcrumb [routerLink]="['../../']">Home</ion-breadcrumb>
            <ion-breadcrumb [routerLink]="['../']">Contracts</ion-breadcrumb>
            <ion-breadcrumb>Create</ion-breadcrumb>
          }
        </app-breadcrumbs>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12" size-md="9" size-xl="6">
        <ion-item color="transparent" lines="none">
          <ion-label>
            <ion-title>
              {{uuid ? 'Edit' : 'Create'}} Contract 
            </ion-title>
          </ion-label>
        </ion-item>
        <form [formGroup]="form()" (ngSubmit)="onSubmit()">
          <ion-card>
            <ion-card-content>
              <ion-list>
                <ion-item>
                  <ion-input label="Name" formControlName="name"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="Display Name" formControlName="display_name"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="Phone" type="phone" formControlName="phone"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="email" type="email" formControlName="email"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="Primary Address" formControlName="primary_address"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="Secondary Address" formControlName="secondary_address"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="Tertiary Address" formControlName="tertiary_address"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="City" formControlName="city"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="State" formControlName="state"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="Zip" formControlName="zip"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-textarea label="Description" formControlName="description" autoGrow></ion-textarea>
                </ion-item>
                <ion-item>
                  <ion-textarea label="Note" formControlName="note" autoGrow></ion-textarea>
                </ion-item>
                <ion-item>
                  <ion-checkbox color="dark" formControlName="is_active">Is Active</ion-checkbox>
                </ion-item>
              </ion-list>
            </ion-card-content>
          </ion-card>
          <ion-item color="transparent" lines="none">
            <ion-buttons>
              <ion-button type="submit" [disabled]="form()?.invalid" color="dark" fill="solid">
                {{uuid ? 'Update' : 'Create'}}
              </ion-button>
              <ion-button (click)="cancel()">
                Cancel 
              </ion-button>
            </ion-buttons>
          </ion-item>
        </form>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
