<ion-content class="page-content">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="9" size-xl="6">
        <ion-item color="transparent" lines="none">
          <ion-label>
            <ion-title>
              Register 
            </ion-title>
          </ion-label>
        </ion-item>
        <form [formGroup]="form()" (ngSubmit)="onSubmit()">
          <ion-card>
            <ion-card-content>
              <ion-list>
                <ion-item>
                  <ion-input label="Name" formControlName="name"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="Email" type="email" formControlName="email"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="Password" type="password" formControlName="password"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="Confirm Password" type="password" formControlName="confirm_password"></ion-input>
                </ion-item>
                <ion-item class="ion-display-none">
                  <ion-label>
                    {{form()?.get('uuid')?.value}}
                  </ion-label>
                </ion-item>
              </ion-list>
            </ion-card-content>
          </ion-card>
          <ion-item color="transparent" lines="none">
            <ion-buttons slot="start">
              <ion-button type="submit" color="dark" fill="solid" [disabled]="form()?.invalid">
                Submit
              </ion-button>
            </ion-buttons>
            <ion-buttons slot="end">
              <ion-button [routerLink]="['/login']">
                Login
              </ion-button>
              <ion-button [routerLink]="['/forgot-password']">
                Forgot Password
              </ion-button>
            </ion-buttons>
          </ion-item>
        </form>
        <ion-item color="transparent" lines="none">
          <ion-label>
            <ion-note>
              You'll need to verify your email in order to access most account features.
            </ion-note>
          </ion-label>
        </ion-item>
        @if(errors()){
          <ion-item>
            <ion-label>
              {{errors() | json}}
            </ion-label>
          </ion-item>
        }
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
