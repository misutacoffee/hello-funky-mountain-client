<ion-modal [trigger]="trigger()" (willDismiss)="onWillDismiss($event)">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="cancel()">Cancel</ion-button>
        </ion-buttons>
        <ion-title>Create Model</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="confirm()" [strong]="true">Confirm</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list [formGroup]="form()">
        <ion-item>
          <ion-input label="Name" formControlName="name"></ion-input>
        </ion-item>
        <ion-item>
          <ion-select 
            (ionChange)="manufacturerSelectChange($event)" 
            label="Manufacturer" 
            [value]="selectedManufacturer()?.uuid"
            placeholder="Select a Manufacturer"
          >
            @for(manufacturer of manufacturers(); track manufacturer.uuid){
              <ion-select-option [value]="manufacturer.uuid">{{manufacturer?.name ?? 'Unknown Manufacturer'}}</ion-select-option>
            }
          </ion-select>
          <ion-buttons slot="end">
            @if(selectedManufacturer()){
              <ion-button (click)="deselectManufacturer()" color="dark" fill="clear" [disabled]="!selectedManufacturer()">
                <ion-icon name="close-outline"></ion-icon>
              </ion-button>
            }@else{
              <ion-button id="model-modal-manufacturer-modal" color="dark" fill="clear">
                <ion-icon name="add-outline"></ion-icon>
              </ion-button>
              <app-create-manufacturer-modal trigger="model-modal-manufacturer-modal" (willDismiss)="onManufacturerDismiss($event)"></app-create-manufacturer-modal>
            }
          </ion-buttons>
        </ion-item>
        <ion-item>
          <ion-input label="Type" formControlName="type"></ion-input>
        </ion-item>
        <ion-item>
          <ion-textarea label="Description" formControlName="description" autoGrow></ion-textarea>
        </ion-item>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>
