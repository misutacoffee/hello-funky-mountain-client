<ion-modal [trigger]="trigger()" (willDismiss)="onWillDismiss($event)">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="cancel()">Cancel</ion-button>
        </ion-buttons>
        <ion-title>Equipment Select</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="confirm()" [strong]="true">Confirm</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        @if(!displayEquipment() || displayEquipment()?.length === 0){
          <ion-item>
            <ion-label>
              No Equipment Available
            </ion-label>
          </ion-item>
        }@else{
          @for(equipment of displayEquipment(); track equipment.uuid){
            <ion-item>
              <ion-label>
                <ion-checkbox 
                  (ionChange)="toggleSelect(equipment?.uuid)" 
                  [checked]="equipment?.isSelected" 
                  color="dark" labelPlacement="end" 
                  [value]="equipment?.uuid"
                >
                  {{equipment?.name || 'Unknown Equipment'}}
                </ion-checkbox>
              </ion-label>
            </ion-item>
          }
        }
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>
