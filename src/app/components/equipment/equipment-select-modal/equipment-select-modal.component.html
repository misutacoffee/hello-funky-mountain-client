<ion-modal [trigger]="trigger()" (willDismiss)="onWillDismiss($event)">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="cancel()">Cancel</ion-button>
        </ion-buttons>
        <ion-title>Equipment Select</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="confirm()" [strong]="true" [disabled]="form()?.invalid">Confirm</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        @if(!equipment() || equipment()?.length === 0){
          <ion-item>
            <ion-label>
              No Equipment Available
            </ion-label>
          </ion-item>
        }@else{
          @for(equipment of equipment(); track equipment.uuid){
            <ion-item>
              <ion-label>
                <ion-checkbox color="dark" labelPlacement="end" [value]="equipment?.uuid">
                  {{equipment?.name || 'Unknown Equipment'}}
                  <small>
                    {{equipment?.model?.name}}
                  </small>
                </ion-checkbox>
              </ion-label>
            </ion-item>
          }
        }
        @if(errors()){
          <ion-item>
            <ion-label>
              {{errors() | json}}
            </ion-label>
          </ion-item>
        }
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>
