<ion-item color="transparent" lines="none">
  <ion-buttons slot="start">
    <ion-button (click)="locationTest()" color="primary" fill="solid">
      location
    </ion-button>
    <ion-button (click)="routerTest()" color="success" fill="solid" disabled>
      router
    </ion-button>
    <ion-button (click)="navCtlTest()" color="warning" fill="solid">
      navCtl
    </ion-button>
    <ion-button (click)="navServTest()" color="danger" fill="solid">
      navServ
    </ion-button>
  </ion-buttons>
</ion-item>
