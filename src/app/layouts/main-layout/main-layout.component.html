<ion-app>

  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button />
        <ion-button [routerLink]="['']">
          <ion-icon name="home-outline"></ion-icon>
        </ion-button>
      </ion-buttons>

      <ion-title>
        Equipment Rental
      </ion-title>
      <ion-buttons slot="end">
        <ion-button [routerLink]="['/login']">
          Login
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-item [routerLink]="'/contracts'" routerDirection="root">
          <ion-label>Contracts</ion-label>
        </ion-item>
        <ion-item [routerLink]="'/equipment'" routerDirection="root">
          <ion-label>Equipment</ion-label>
        </ion-item>
        <ion-item [routerLink]="'/invoices'" routerDirection="root">
          <ion-label>Invoices</ion-label>
        </ion-item>
        <ion-item [routerLink]="'/manufacturers'" routerDirection="root">
          <ion-label>Manufacturers</ion-label>
        </ion-item>
        <ion-item [routerLink]="'/models'" routerDirection="root">
          <ion-label>Models</ion-label>
        </ion-item>
        <ion-item [routerLink]="'/settings'" routerDirection="root">
          <ion-label>Settings</ion-label>
        </ion-item>
      </ion-list>
      <!-- navigation -->
    </ion-content>
  </ion-menu>

  <ion-content id="main-content">
    <ion-router-outlet></ion-router-outlet>
  </ion-content>

</ion-app>
