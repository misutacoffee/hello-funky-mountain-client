<ion-app>
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-toggle>
          <ion-button color="primary">
            <ion-icon name="menu-outline"></ion-icon>
          </ion-button>
        </ion-menu-toggle>
        <ion-button [routerLink]="['']">
          <img src="assets/icon/favicon.png" alt="" class="img-icon">
        </ion-button>
      </ion-buttons>
      <ion-title color="primary">
        {{appName}}
      </ion-title>
      <ion-buttons slot="end">
        @if(user()){
          <app-nav-profile-popover [user]="user()">
            <ion-item [routerLink]="['profile']" button>
              <ion-text color="primary">
                Profile
              </ion-text>
            </ion-item>
            <ion-item [routerLink]="['settings']" button>
              <ion-text color="primary">
                Settings
              </ion-text>
            </ion-item>
            <ion-item [id]="logoutAlertTrigger" button>
              <ion-text color="primary">
                Logout
              </ion-text>
            </ion-item>
            <ion-alert [trigger]="logoutAlertTrigger" header="Logout?" message="Log out of Equipment Rental?" [buttons]="alertButtons"></ion-alert>
          </app-nav-profile-popover>
        }@else{
          <ion-button [routerLink]="['/login']">
            <ion-text color="primary">
              Login
            </ion-text>
          </ion-button>
        }
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title color="primary">
          Menu
        </ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-menu-toggle>
        <ion-list>
          <ion-item [routerLink]="'/contracts'" routerDirection="root">
            <ion-label>Contracts</ion-label>
          </ion-item>
          <ion-item [routerLink]="'/equipment'" routerDirection="root">
            <ion-label>Equipment</ion-label>
          </ion-item>
          <ion-item [routerLink]="'/invoices'" routerDirection="root">
            <ion-label>Invoices</ion-label>
          </ion-item>
          <ion-item [routerLink]="'/manufacturers'" routerDirection="root">
            <ion-label>Manufacturers</ion-label>
          </ion-item>
          <ion-item [routerLink]="'/models'" routerDirection="root">
            <ion-label>Models</ion-label>
          </ion-item>
          <ion-item [routerLink]="'/settings'" routerDirection="root">
            <ion-label>Settings</ion-label>
          </ion-item>
        </ion-list>
      </ion-menu-toggle>
    </ion-content>
  </ion-menu>
  <ion-content id="main-content">
    <ion-router-outlet></ion-router-outlet>
  </ion-content>
</ion-app>
